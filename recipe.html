<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe — The Family Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <a class="site-title" href="index.html">The Family <span>Table</span></a>
  <nav>
    <a href="index.html">Recipes</a>
    <a href="planner.html">Meal Planner</a>
    <a href="#">About</a>
  </nav>
</header>

<main class="recipe-page" id="recipe-root">
  <p style="color: var(--ink-faint); font-size: 0.9rem;">Loading recipe…</p>
</main>

<footer>
  The Family Table &nbsp;·&nbsp; Made with love
</footer>

<script src="recipes-data.js"></script>
<script>
// ── Utility: format a number for display (fractions for small values)
function formatAmount(num) {
  const fractions = [
    [1, '1'], [3/4, '¾'], [2/3, '⅔'], [1/2, '½'],
    [1/3, '⅓'], [1/4, '¼'], [1/8, '⅛']
  ];
  if (num <= 0) return '';

  const whole = Math.floor(num);
  const remainder = num - whole;

  let fracStr = '';
  if (remainder > 0.05) {
    let best = null, bestDiff = Infinity;
    for (const [val, sym] of fractions) {
      const diff = Math.abs(remainder - val);
      if (diff < bestDiff) { bestDiff = diff; best = sym; }
    }
    if (bestDiff < 0.07 && best !== '1') {
      fracStr = best;
    } else {
      return (Math.round(num * 10) / 10).toString();
    }
  }

  if (whole === 0) return fracStr;
  if (fracStr === '') return whole.toString();
  return `${whole} ${fracStr}`;
}

// ── Render the full recipe page from a RECIPES entry
function renderRecipe(recipe) {
  const ingredients = recipe.ingredients || [];
  const steps = recipe.steps || [];
  const notes = recipe.notes || null;

  document.title = `${recipe.title || 'Recipe'} — The Family Table`;

  let baseServings = parseInt(recipe.servings) || 4;
  let currentServings = baseServings;

  function buildIngredientHTML(servings) {
    const scale = servings / baseServings;
    return ingredients.map(ing => {
      const amt = (ing.amount !== null && ing.amount !== undefined)
        ? `<span class="ingredient-amount">${formatAmount(ing.amount * scale)}${ing.unit ? ' ' + ing.unit : ''}</span>`
        : `<span class="ingredient-amount">—</span>`;
      return `<li>${amt}<span>${ing.name}</span></li>`;
    }).join('');
  }

  const tagsHTML = (recipe.tags || []).length
    ? `<div class="recipe-tags">${recipe.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
    : '';

  const stepsHTML = steps.map((step, i) => `
    <div class="step">
      <div class="step-number">${i + 1}</div>
      <div class="step-content">
        <div class="step-title">${step.title}</div>
        <p class="step-text">${step.text}</p>
      </div>
    </div>
  `).join('');

  const notesHTML = notes
    ? `<div class="notes-section"><h2>Notes</h2>${notes.split('\n').map(p => `<p>${p}</p>`).join('')}</div>`
    : '';

  const metaItems = [
    recipe.origin ? `<div class="meta-item"><span class="meta-label">Origin</span><span class="meta-value">${recipe.origin}</span></div>` : '',
    recipe.time   ? `<div class="meta-item"><span class="meta-label">Time</span><span class="meta-value">${recipe.time}</span></div>` : '',
    recipe.instant_pot ? `<div class="meta-item"><span class="meta-label">Instant Pot</span><span class="meta-value">Yes ✓</span></div>` : '',
  ].filter(Boolean).join('');

  const html = `
    <a class="back-link" href="index.html">All Recipes</a>

    <div class="recipe-header">
      ${recipe.origin ? `<div class="recipe-origin">${recipe.origin}</div>` : ''}
      <h1 class="recipe-title">${recipe.title || 'Untitled Recipe'}</h1>
      ${recipe.description ? `<p class="recipe-description">${recipe.description}</p>` : ''}
      <div class="recipe-meta">${metaItems}</div>
      ${tagsHTML}
    </div>

    <div class="recipe-body">
      <div class="ingredients-section">
        <h2>Ingredients</h2>
        <div class="servings-control">
          <button id="dec" aria-label="Fewer servings">−</button>
          <span class="servings-display" id="servings-display">Serves ${currentServings}</span>
          <button id="inc" aria-label="More servings">+</button>
        </div>
        <ul class="ingredient-list" id="ingredient-list">
          ${buildIngredientHTML(currentServings)}
        </ul>
      </div>

      <div class="steps-section">
        <h2>Method</h2>
        ${stepsHTML}
      </div>

      ${notesHTML}
    </div>
  `;

  document.getElementById('recipe-root').innerHTML = html;

  document.getElementById('inc').addEventListener('click', () => {
    currentServings = Math.min(currentServings + 1, 24);
    document.getElementById('servings-display').textContent = `Serves ${currentServings}`;
    document.getElementById('ingredient-list').innerHTML = buildIngredientHTML(currentServings);
  });
  document.getElementById('dec').addEventListener('click', () => {
    currentServings = Math.max(currentServings - 1, 1);
    document.getElementById('servings-display').textContent = `Serves ${currentServings}`;
    document.getElementById('ingredient-list').innerHTML = buildIngredientHTML(currentServings);
  });
}

// ── Load the recipe specified in ?r=recipe-id from the RECIPES object
function loadRecipe() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('r');
  if (!id) {
    document.getElementById('recipe-root').innerHTML = '<p>No recipe specified. Add <code>?r=recipe-id</code> to the URL.</p>';
    return;
  }
  const recipe = (typeof RECIPES !== 'undefined') ? RECIPES[id] : null;
  if (!recipe) {
    document.getElementById('recipe-root').innerHTML = `<p>Recipe "${id}" could not be found.</p>`;
    return;
  }
  renderRecipe(recipe);
}

loadRecipe();
</script>
</body>
</html>
